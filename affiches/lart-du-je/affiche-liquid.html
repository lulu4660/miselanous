<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'Art du Je — Liquid Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  /* Modes (set by ?mode=): bg = scene only, fg = text/logo only on transparent, full = guide preview */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  .poster{position:relative; width:1240px; height:1754px; overflow:hidden; font-family:'Inter Tight',sans-serif; color:#fff;
    background:radial-gradient(120% 90% at 50% 0%, #0f4a2e 0%, #062416 45%, #03140b 100%);}

  /* ---------- scene behind the glass: crisp, high-contrast shapes ---------- */
  .scene{position:absolute; inset:0}
  .velvet{position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,#03170c 0 14px,#0d4428 26px,#1d7748 30px,#3f9e6c 32px,#1d7748 34px,#0d4428 40px,#03170c 54px);
    -webkit-mask-image:radial-gradient(75% 60% at 50% 40%, rgba(0,0,0,.45), rgba(0,0,0,.95));
            mask-image:radial-gradient(75% 60% at 50% 40%, rgba(0,0,0,.45), rgba(0,0,0,.95));}
  .vignette{position:absolute; inset:0; background:radial-gradient(60% 45% at 50% 40%, rgba(40,140,90,.35) 0%, rgba(3,20,11,0) 60%), radial-gradient(90% 70% at 50% 45%, rgba(3,20,11,0) 50%, rgba(2,10,6,.6) 100%);}
  .orb{position:absolute; border-radius:50%;}
  .o1{width:470px; height:470px; left:-150px; top:40px; background:radial-gradient(circle at 35% 30%, #fff0bf, #f5b443 50%, #c97a16 100%);}
  .o2{width:440px; height:440px; right:-140px; top:640px; background:radial-gradient(circle at 35% 30%, #ffb39b, #ec5233 50%, #a92a15 100%);}
  .o3{width:520px; height:520px; left:-190px; top:1230px; background:radial-gradient(circle at 35% 30%, #a6f7d4, #23b071 50%, #0b6440 100%);}
  .o4{width:300px; height:300px; right:-150px; top:1600px; background:radial-gradient(circle at 35% 30%, #fff0bf, #f5b443 50%, #c97a16 100%);}
  .o5{width:170px; height:170px; left:1080px; top:1290px; background:radial-gradient(circle at 35% 30%, #ffb39b, #ec5233 55%, #a92a15 100%);}
  .ring{position:absolute; left:50%; top:150px; width:1180px; height:1180px; transform:translateX(-50%); border-radius:50%;
    border:7px solid #e9c06a;}
  .ring2{position:absolute; left:50%; top:330px; width:820px; height:820px; transform:translateX(-50%); border-radius:50%;
    border:3px solid rgba(255,236,190,.7);}
  .ghost{position:absolute; left:0; right:0; top:930px; text-align:center; font-weight:900; font-size:250px; letter-spacing:-.04em;
    color:transparent; -webkit-text-stroke:3px rgba(255,226,160,.55); white-space:nowrap;}

  /* ---------- glass geometry (panels are drawn by the compositor) ---------- */
  .glass{position:absolute;}
  .pill-top{left:50%; top:86px; transform:translateX(-50%); height:76px; padding:0 40px; border-radius:38px;
    display:flex; align-items:center; gap:18px; white-space:nowrap; font-size:28px; font-weight:600;}
  .dot{width:12px; height:12px; border-radius:50%; background:#5fe0a8;}
  .sep{opacity:.55}
  .hero{left:70px; right:70px; top:206px; height:820px; border-radius:72px; text-align:center;}
  .lens{left:455px; top:268px; width:330px; height:330px; border-radius:165px;}
  .disc{position:absolute; left:477px; top:290px; width:286px; height:286px; border-radius:50%; overflow:hidden; background:#f7f1e3;
    box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .disc img{width:100%; height:100%; display:block; mix-blend-mode:multiply;}
  .brand{position:absolute; left:0; right:0; top:626px; text-align:center; font-size:150px; font-weight:900; letter-spacing:-.028em; line-height:1;
    text-shadow:0 4px 24px rgba(0,0,0,.35);}
  .brand em{font-style:italic; padding-right:.06em; color:#ffd36e;}
  .slogan{position:absolute; left:0; right:0; top:806px; text-align:center; font-size:56px; font-weight:700; letter-spacing:-.02em; text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .tagline{position:absolute; left:0; right:0; top:886px; text-align:center; font-size:36px; font-weight:500; color:rgba(255,255,255,.88); text-shadow:0 2px 10px rgba(0,0,0,.45);}
  .tagline b{color:#ffd77a; font-weight:700}
  .section{position:absolute; left:0; right:0; top:1068px; text-align:center; font-size:30px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .tile{top:1130px; width:340px; height:220px; border-radius:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .t1{left:70px} .t2{left:450px} .t3{left:830px}
  .tile .who{font-size:58px; font-weight:800; letter-spacing:-.03em; line-height:1}
  .tile .yrs{font-size:34px; font-weight:700; color:#fff3d1}
  .chip{top:1390px; height:74px; padding:0 34px; border-radius:37px; display:flex; align-items:center; font-size:32px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.45)}
  .c1{left:266px} .c2{left:520px} .c3{left:695px}
  .dock{left:70px; right:70px; top:1488px; height:196px; border-radius:60px; display:flex; align-items:center; justify-content:space-between; padding:0 50px; text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .place{font-size:30px; font-weight:500; color:rgba(255,255,255,.9); line-height:1.3}
  .place b{display:block; color:#fff; font-size:38px; font-weight:800}
  .cta{font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#ffd77a; margin-bottom:6px}
  .call{text-align:right}
  .tel{font-size:68px; font-weight:900; letter-spacing:-.02em; line-height:1}
  .ig{margin-top:10px; font-size:32px; font-weight:700}
  .ig svg{width:30px; height:30px; vertical-align:-5px; margin-right:8px}

  html.bg .fgonly, html.bg .glass{visibility:hidden}
  html.fg, html.fg body, html.fg .poster{background:transparent !important}
  html.fg .scene{display:none}
  html.full .glass{background:rgba(255,255,255,.12); outline:1px solid rgba(255,255,255,.5)}
</style>
<script>document.documentElement.className=(new URLSearchParams(location.search).get('mode')||'full');</script>
</head>
<body>
<div class="poster">
  <div class="scene">
    <div class="velvet"></div>
    <div class="vignette"></div>
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div><div class="orb o5"></div>
    <div class="ring"></div><div class="ring2"></div>
  </div>

  <div class="glass pill-top" data-bezel="18"><span class="dot"></span>Professeur de théâtre<span class="sep">·</span>Oyonnax &amp; alentours</div>
  <div class="glass hero" data-bezel="44" data-frost="1"></div>
  <div class="glass lens" data-bezel="30"></div>
  <div class="disc fgonly"><img src="logo_rond.png" alt="Logo L'Art du Je"></div>
  <h1 class="brand fgonly">L'Art du <em>Je</em></h1>
  <p class="slogan fgonly">Entre en scène.</p>
  <p class="tagline fgonly">Ici, le jeu commence par <b>Je</b>.</p>

  <p class="section fgonly">Cours de théâtre à l'année</p>
  <div class="glass tile t1" data-bezel="34" data-frost="1"><div class="who">Enfants</div><div class="yrs">7 – 11 ans</div></div>
  <div class="glass tile t2" data-bezel="34" data-frost="1"><div class="who">Ados</div><div class="yrs">12 – 16 ans</div></div>
  <div class="glass tile t3" data-bezel="34" data-frost="1"><div class="who">Adultes</div><div class="yrs">dès 17 ans</div></div>
  <div class="glass chip c1" data-bezel="18">Spectacles</div>
  <div class="glass chip c2" data-bezel="18">Impro</div>
  <div class="glass chip c3" data-bezel="18">Scène ouverte</div>

  <div class="glass dock" data-bezel="40" data-frost="1">
    <div class="place"><div class="cta">Infos &amp; inscriptions</div><b>Salle Mogador</b>Montréal-la-Cluse</div>
    <div class="call">
      <div class="tel">06 37 43 88 00</div>
      <div class="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>@lart.du.je</div>
    </div>
  </div>
</div>
</body>
</html>
